name: ThermoSentinel Sentinel-2 pilot
on:
  workflow_dispatch:
  # After successful test and scientific review, uncomment the two lines below:
  # schedule:
  #   - cron: '15 2 * * *'  # 02:15 UTC = 09:15 Thailand; GitHub times are UTC
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
      EE_SERVICE_ACCOUNT_JSON: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      DRY_RUN: 'true'  # Change to 'false' ONLY after successful dry-run review
      LOOKBACK_DAYS: '14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install earthengine-api==1.7.52 google-auth
      - name: Validate Earth Engine and print candidates
        run: python sync_sentinel2.py
