name: ThermoSentinel Sentinel-2 keyless pilot

on:
  workflow_dispatch:
  # Do not enable a schedule until a successful dry run has been reviewed.

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EE_PROJECT_ID: ${{ secrets.EE_PROJECT_ID }}
      DRY_RUN: 'true'
      LOOKBACK_DAYS: '14'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud without a private key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.EE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: thermosentinel-monitor@gee-uav-thermal-imaging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install earthengine-api==1.7.52 google-auth

      - name: Test Earth Engine authentication and print candidate observations (NO DATABASE WRITES)
        run: python sync_sentinel2.py
